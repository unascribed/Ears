buildscript {
	repositories {
		mavenCentral()
		gradlePluginPortal()
		maven { url 'https://maven.fabricmc.net' }
		maven { url 'https://repo.sleeping.town' }
		maven { url 'https://maven.minecraftforge.net/' }
	}
	dependencies {
		classpath 'com.unascribed:voldeloom:1.0.1+1.2.5'
		classpath 'com.github.jengelman.gradle.plugins:shadow:4.0.4'
		classpath 'me.tatarka:gradle-retrolambda:3.7.1'
		// the eclipse jdt artifacts pulled in by mercury have dynamic version specs, and eclipse
		// moved from compiling for java 8 to 17 without a major version bump. villains do this
		////
		// we're stuck on java 8 due to the old version of gradle, and we're stuck on the old
		// version of gradle in order to use legacy voldeloom. the new quat voldeloom doesn't
		// support 1.2.5 yet
		classpath('org.eclipse.platform:org.eclipse.core.resources') {
			version { strictly '3.12.0' }
		}
		classpath('org.eclipse.platform:org.eclipse.core.expressions') {
			version { strictly '3.9.400' }
		}
		classpath('org.eclipse.platform:org.eclipse.core.runtime') {
			version { strictly '3.32.0' }
		}
		classpath('org.eclipse.platform:org.eclipse.core.filesystem') {
			version { strictly '1.11.100' }
		}
		classpath('org.eclipse.platform:org.eclipse.text') {
			version { strictly '3.6.0' }
		}
	}
}

apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'java'
apply plugin: 'com.unascribed.voldeloom'

sourceCompatibility = 8
targetCompatibility = 8

def mcp = "mcp62.zip";

if (!file(mcp).exists()) {
	println "Downloading ${mcp} from archive.org..."
	file(mcp).withOutputStream {
		it << new URL("https://archive.org/download/minecraftcoderpack/minecraftcoderpack.zip/minecraftcoderpack%2F${project.minecraft_version}%2F${mcp}").openStream()
	}
	println "Patching MCP..."
	'./patch-mcp.sh'.execute()
}

archivesBaseName = project.archives_base_name
version = file('../version.txt').text.trim()+file('version-suffix.txt').text.trim()
group = project.maven_group

repositories {
	maven {
		name = 'jitpack'
		url = 'https://jitpack.io/'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
//	maven { url = 'https://files.minecraftforge.net/maven' }
	maven { url = 'https://repo.spongepowered.org/maven' }
}

configurations {
	shade
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	forge "net.minecraftforge:forge:1.2.5-3.4.9.171:client@zip"
	mappings files(mcp)
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	
	compile files('../common/build/libs/ears-common-agent-vlegacy.jar')
	shade files('../common/build/libs/ears-common-agent-vlegacy.jar')
}

subprojects {
	apply plugin: 'me.tatarka.retrolambda'
}

shadowJar {
	configurations = [project.configurations.shade]
	relocate 'net.minecraft.src.TDIAccess', 'TDIAccess'
	
	exclude 'module-info.class'
	exclude 'META-INF/maven/**'
}

processResources {
	inputs.property "version", project.version

	from(sourceSets.main.resources.srcDirs) {
		include "mcmod.info"
		expand "version": project.version
	}

	from(sourceSets.main.resources.srcDirs) {
		exclude "mcmod.info"
	}
}

remapJar {
	dependsOn shadowJar
	input = file(shadowJar.archivePath)
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}

jar {
	from "LICENSE"
	manifest {
		attributes(["Premain-Class": "com.unascribed.ears.common.agent.EarsAgent"])
	}
}

build.doLast {
	file(shadowJar.archivePath).delete()
}

compileJava.doFirst {
	'../common/replace-version.sh src/main/java/mod_Ears.java src/main/java/com/unascribed/ears/EarsPlatformVersion.java'.execute()
}
